<div id="home" class="home">
  <!-- Hero Section -->
  <section class="hero">
    <div class="anime-left">
      <p class="hero-subtitle">{{ 'home.greeting' | translate }}</p>
      <h1 class="hero-title">{{ 'home.name' | translate }}</h1>
      <p class="hero-description">
        {{ 'home.description' | translate }}
      </p>
      <div class="hero-buttons">
        <app-button variant="primary">{{ 'home.viewProjects' | translate }}</app-button>
        <app-button variant="outline">{{ 'home.getInTouch' | translate }}</app-button>
      </div>
    </div>
    <div class="hero-visual">
      <div class="glow-circle anime-float"></div>
    </div>
  </section>
