<div id="home" class="home">
  <section class="home__hero">
    <div class="anime-left">
      <a class="home__hero__greeting">{{ 'home.greeting' | translate }}</a>
      <h1 class="home__hero__title">{{ 'home.name' | translate }}</h1>

      <div class="home__hero__subtitle">
        <div>{{ 'home.subtitle_jog' | translate }}</div>
        <div class="home__hero__job">
          @for (subtitleKey of subtitleKeys; track subtitleKey; let i = $index) {
            <span [class.active]="currentSubtitleIndex() === i">
              {{ subtitleKey | translate }}
            </span>
          }
        </div>
      </div>

      <p class="home__hero__description">
        {{ 'home.description' | translate }}
      </p>

      <div class="home__hero__buttons">
        <app-button variant="primary" [text]="'home.viewProjects' | translate" icon="ph ph-arrow-right" (click)="scrollTo('projects')"></app-button>
        <app-button variant="outline" [text]="'home.getInTouch' | translate" icon="ph ph-paper-plane-tilt" (click)="scrollTo('contact')"></app-button>
      </div>
    </div>

    <div class="home__hero__visual">
      <div class="home__hero__glow-ring"></div>

      <div class="home__hero__photo-wrapper">
        <img
          class="home__hero__photo"
          src="assets/images/profile.png"
          alt="Jackciel Felix"
        />
      </div>

      <div class="home__hero__tech-icon home__hero__tech-icon--react">
        <img src="assets/images/tech/react.svg" alt="React" />
      </div>
      <div class="home__hero__tech-icon home__hero__tech-icon--ts">
        <span>TS</span>
      </div>
      <div class="home__hero__tech-icon home__hero__tech-icon--tailwind">
        <img src="assets/images/tech/tailwind.svg" alt="Tailwind" />
      </div>
      <div class="home__hero__tech-icon home__hero__tech-icon--js">
        <span>JS</span>
      </div>
      <div class="home__hero__tech-icon home__hero__tech-icon--angular">
        <img src="assets/images/tech/angular.svg" alt="Angular" />
      </div>
      <div class="home__hero__tech-icon home__hero__tech-icon--html">
        <span>&lt;/&gt;</span>
      </div>
    </div>
  </section>
</div>
