<section id="projects" class="projects section">
  <div class="projects__content padding-top">
    <div class="anime-left">
      <h2 class="section__title">{{ 'projects.title' | translate }}</h2>
      <p class="section__subtitle">{{ 'projects.subtitle' | translate }}</p>
      <p class="section__description">
        {{ 'projects.description' | translate }}
      </p>
      <app-button variant="outline" [text]="'projects.viewAll' | translate" icon="ph ph-arrow-right" (click)="openGithub()"></app-button>
    </div>

    <div class="projects__grid">
      <div class="carousel__wrapper">
        <button class="carousel__btn carousel__btn--prev" (click)="prev()" aria-label="Previous project">
          <i class="ph ph-caret-left"></i>
        </button>

        <div class="carousel">
          <div class="carousel__track"
               [style.transform]="transformPercent"
               [style.transition]="animated() ? 'transform 0.4s cubic-bezier(.22,.9,.33,1)' : 'none'">
            <app-card *ngFor="let project of projects; let i = index; trackBy: trackById">
            <article class="project-card">
              <div class="project-card__image">
                <img [src]="project.url" alt="Image project" />

                <div class="project-card__tech">
                  <span class="project-card__badge" *ngFor="let tech of project.technologies">{{ tech }}</span>
                </div>
              </div>

              <div class="project-card__info">
                <h3 class="project-card__title">{{ project.title | translate }}</h3>
                <p class="project-card__description">{{ project.description | translate }}</p>
                
                <div class="project-card__links">
                  <a *ngIf="project.demoUrl" [href]="project.demoUrl" target="_blank" rel="noopener noreferrer"
                     [attr.tabindex]="isVisible(i) ? null : -1"
                     [attr.aria-hidden]="isVisible(i) ? null : true">Demo →</a>
                  <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank" rel="noopener noreferrer"
                     [attr.tabindex]="isVisible(i) ? null : -1"
                     [attr.aria-hidden]="isVisible(i) ? null : true">GitHub →</a>
                </div>
              </div>
            </article>
          </app-card>
          </div>
        </div>

        <button class="carousel__btn carousel__btn--next" (click)="next()" aria-label="Next project">
          <i class="ph ph-caret-right"></i>
        </button>
      </div>
    </div>
  </div>
</section>
