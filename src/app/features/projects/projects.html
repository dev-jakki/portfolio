<section id="projects" class="projects section">
  <div class="projects__content padding-top">
    <div class="anime-up">
      <h2 class="section__title">{{ 'projects.title' | translate }}</h2>
      <p class="section__subtitle">{{ 'projects.subtitle' | translate }}</p>
    </div>

    <div class="projects__grid">
      <div class="carousel__wrapper">
        <button class="carousel__btn carousel__btn--prev" (click)="prev()" [disabled]="!canPrev" aria-label="Previous project">
          <i class="ph ph-caret-left"></i>
        </button>

        <div class="carousel">
          <div class="carousel__track" [style.transform]="transformPercent">
            <app-card *ngFor="let project of projects; let i = index; trackBy: trackById">
            <article class="project-card">
              <div class="project-card__image">
                <img [src]="project.url" alt="Image project" />

                <div class="project-card__tech">
                  <span class="project-card__badge" *ngFor="let tech of project.technologies">{{ tech }}</span>
                </div>
              </div>

              <div class="project-card__info">
                <h3 class="project-card__title">{{ project.title | translate }}</h3>
                <p class="project-card__description">{{ project.description | translate }}</p>
                
                <div class="project-card__links">
                  <a *ngIf="project.demoUrl" [href]="project.demoUrl" target="_blank">Demo →</a>
                  <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank">GitHub →</a>
                </div>
              </div>
            </article>
          </app-card>
          </div>
        </div>

        <button class="carousel__btn carousel__btn--next" (click)="next()" [disabled]="!canNext" aria-label="Next project">
          <i class="ph ph-caret-right"></i>
        </button>
      </div>
    </div>
  </div>
</section>
