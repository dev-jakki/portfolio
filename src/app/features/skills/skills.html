<section id="skills" class="skills section">
  <div class="skills__content padding-top">
    <div class="anime-up">
      <h2 class="section__title">{{ 'skills.title' | translate }}</h2>
      <p class="section__subtitle">{{ 'skills.subtitle' | translate }}</p>
    </div>
    
    <div class="skills__container">
      <div class="skills__carousel" aria-label="Skills carousel">
        <div class="skills__track" role="list">
          @for (skill of skills(); track skill.name) {
            <app-card role="listitem">
              <div class="skill-card">
                <div class="skill-card__icon" [title]="skill.name">
                  <img [src]="skill.icon" [alt]="skill.name + ' logo'" />
                </div>
                <span class="skill-card__name">{{ skill.name }}</span>
              </div>
            </app-card>
          }

          @for (skill of skills(); track skill.name) {
            <app-card role="listitem">
              <div class="skill-card">
                <div class="skill-card__icon" [title]="skill.name">
                  <img [src]="skill.icon" [alt]="skill.name + ' logo'" />
                </div>
                <span class="skill-card__name">{{ skill.name }}</span>
              </div>
            </app-card>
          }
        </div>
      </div>
    </div>
  </div>
</section>
