<app-section title="Entre em Contato" subtitle="Vamos conversar sobre novas oportunidades">
  <div class="contact-container">
    <div class="contact-form">
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Nome</label>
          <input 
            id="name"
            type="text" 
            [ngModel]="formData().name" 
            (ngModelChange)="updateForm('name', $event)"
            name="name"
            required
            placeholder="Seu nome"
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input 
            id="email"
            type="email" 
            [ngModel]="formData().email" 
            (ngModelChange)="updateForm('email', $event)"
            name="email"
            required
            placeholder="seu.email@example.com"
          />
        </div>

        <div class="form-group">
          <label for="subject">Assunto</label>
          <input 
            id="subject"
            type="text" 
            [ngModel]="formData().subject" 
            (ngModelChange)="updateForm('subject', $event)"
            name="subject"
            required
            placeholder="Assunto da mensagem"
          />
        </div>

        <div class="form-group">
          <label for="message">Mensagem</label>
          <textarea 
            id="message"
            [ngModel]="formData().message" 
            (ngModelChange)="updateForm('message', $event)"
            name="message"
            required
            placeholder="Sua mensagem..."
            rows="5"
          ></textarea>
        </div>

        <app-button variant="primary">Enviar Mensagem</app-button>
      </form>
    </div>

    <div class="contact-info">
      <div class="info-item">
        <h3>Email</h3>
        <a [href]="'mailto:' + contact.email">{{ contact.email }}</a>
      </div>

      <div class="info-item">
        <h3>Redes Sociais</h3>
        <div class="social-links">
          <a [href]="contact.linkedin" target="_blank" rel="noopener">LinkedIn</a>
          <a [href]="contact.github" target="_blank" rel="noopener">GitHub</a>
          @if (contact.instagram) {
            <a [href]="contact.instagram" target="_blank" rel="noopener">Instagram</a>
          }
        </div>
      </div>

      <div class="info-item">
        <h3>Disponibilidade</h3>
        <p>Disponível para projetos freelancer e oportunidades full-time. Respondo em até 24 horas.</p>
      </div>
    </div>
  </div>
</app-section>
