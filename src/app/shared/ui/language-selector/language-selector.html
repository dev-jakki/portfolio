<div class="language-selector">
  <button 
    class="language-btn"
    (click)="toggleLanguageDropdown()"
    [attr.aria-expanded]="languageDropdownOpen()"
    aria-label="Select language"
  >
    <img 
      [src]="getCurrentLanguageImage()" 
      alt="image"
      class="image-icon"
    />
    <span>{{ getCurrentLanguageFlag() }}</span>
  </button>
  
  @if (languageDropdownOpen()) {
    <div class="language-dropdown anime-slide-down">
      @for (lang of languages; track lang.code) {
        <button
          class="language-option"
          [class.active]="translateService.getLanguage() === lang.code"
          (click)="selectLanguage(lang.code)"
        >
          <img 
            [src]="lang.image" 
            alt="{{ lang.name }}"
            class="image-icon"
          />
          <span>{{ lang.name }}</span>
        </button>
      }
    </div>
  }
</div>
