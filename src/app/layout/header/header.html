<header class="header">
  <div class="header-container">
    <div class="logo">
      <a routerLink="/">
        <span class="logo-text">Jakki</span>
        <span class="logo-symbol">&#46;</span>
      </a>
    </div>

    <nav class="nav" [class.nav-open]="menuOpen()" aria-label="Main navigation">
      <ul class="nav-links">
        <li [class.active]="menuActive('')">
          <a href="#home" (click)="closeMenu()">{{ 'nav.home' | translate }}</a>
        </li>
        <li [class.active]="menuActive('about-me')">
          <a href="#about-me" (click)="closeMenu()">{{ 'nav.about' | translate }}</a>
        </li>
        <li [class.active]="menuActive('skills')">
          <a href="#skills" (click)="closeMenu()">{{ 'nav.skills' | translate }}</a>
        </li>
        <li [class.active]="menuActive('projects')">
          <a href="#projects" (click)="closeMenu()">{{ 'nav.projects' | translate }}</a>
        </li>
        <li [class.active]="menuActive('experience')">
          <a href="#experience" (click)="closeMenu()">{{ 'nav.experience' | translate }}</a>
        </li>
        <li [class.active]="menuActive('contact')">
          <a href="#contact" (click)="closeMenu()">{{ 'nav.contact' | translate }}</a>
        </li>
      </ul>
    </nav>

    <div class="header-actions">
      <button class="download-cv" (click)="openCvModal()" type="button">
        <span>{{ 'header.downloadCV' | translate }}</span>
        <i class="ph ph-arrow-line-down"></i>
      </button>

      <app-theme-button></app-theme-button>

      <app-language-selector></app-language-selector>
    </div>

    <button
      class="mobile-menu-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>

@if (cvModalOpen()) {
  <app-cv-download-modal (closed)="closeCvModal()" />
}
